{% extends 'catalogo/base.html' %}

{% block title %}{{ titulo }} | Tienda de componentes{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 card-title mb-4">{{ titulo }}</h1>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-primary" type="submit">Guardar pieza</button>
                    <a class="btn btn-outline-secondary" href="{% url 'catalogo_publico' %}">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
