{% extends 'catalogo/base.html' %}

{% block title %}Crear una Cuenta | Hardware Store{% endblock %}

{% block content %}
<section class="min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="w-100" style="max-width: 520px;">
        <div class="card border-0 shadow-lg rounded-4">
            <div class="card-body p-4 p-md-5">
                <header class="mb-4 text-center">
                    <h1 class="h2 mb-2">Crear una Cuenta</h1>
                    <p class="text-secondary mb-0">Regístrate para cotizar tus piezas favoritas.</p>
                </header>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-primary btn-lg w-100 mt-3" type="submit">Crear cuenta</button>
                </form>
                <p class="text-center text-secondary mt-4 mb-0">
                    ¿Ya tienes cuenta?
                    <a href="{% url 'login' %}" class="link-primary">Inicia sesión aquí</a>
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
