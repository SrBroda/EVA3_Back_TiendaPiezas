{% extends 'catalogo/base.html' %}

{% block title %}Eliminar pieza | Hardware Store{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <section class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <p class="small text-uppercase text-danger mb-2">Confirmación</p>
                <h1 class="h3 mb-3">¿Eliminar esta pieza?</h1>
                <p class="text-secondary">Vas a eliminar <strong class="text-white">{{ pieza.nombre }}</strong> ({{ pieza.codigo }}). Esta acción no se puede deshacer.</p>
                <form method="post" class="d-flex flex-wrap gap-2 mt-4">
                    {% csrf_token %}
                    <button class="btn btn-danger" type="submit">Sí, eliminar</button>
                    <a class="btn btn-outline-secondary" href="{% url 'listar_piezas_admin' %}">Cancelar</a>
                </form>
            </div>
        </section>
    </div>
</div>
{% endblock %}
