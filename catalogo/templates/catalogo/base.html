<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Tienda de piezas{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex min-vh-100 flex-column">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'catalogo_publico' %}">Tienda PC</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTienda" aria-controls="navbarTienda" aria-expanded="false" aria-label="Abrir navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarTienda">
                <div class="navbar-nav me-auto">
                    <a class="nav-link" href="{% url 'catalogo_publico' %}">Catálogo</a>
                    <a class="nav-link" href="{% url 'ver_carrito' %}">Carrito <span class="badge text-bg-light">{{ cantidad_carrito }}</span></a>
                </div>
                <div class="navbar-nav">
                    {% if user.is_authenticated %}
                        <a class="nav-link" href="{% url 'logout' %}">Cerrar sesión</a>
                    {% else %}
                        <a class="nav-link" href="{% url 'login' %}">Iniciar sesión</a>
                        <a class="nav-link" href="{% url 'registro_cliente' %}">Registro</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="container flex-grow-1 py-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
